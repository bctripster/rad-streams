# Runs the offline test suite on every push and pull request.
name: Tests

on:
  push:
  pull_request:

# The tests only read the code; nothing here needs write access.
permissions:
  contents: read

# A newer push to the same branch cancels a run that's still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the renderer supports, and a current one.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Python packages
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q tests
